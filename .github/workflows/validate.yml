name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n export.sh deploy.sh && sh -n infrastructure/start-http.sh
      - name: Validate exported bundles
        run: |
          shopt -s nullglob
          bundles=(bundles/*/release.json)
          for manifest in "${bundles[@]}"; do
            python3 -m nifi_deploy validate "$(dirname "$manifest")"
          done
      - name: Validate Compose
        env:
          RUNTIME_DIRECTORY: /tmp/nifi-validation
          NIFI_IMAGE: apache/nifi:2.12.0
          NGINX_IMAGE: nginx:1.27-alpine
          REGISTRY_IMAGE: apache/nifi-registry:2.12.0
        run: docker compose -f infrastructure/compose.yml --profile registry config --quiet
