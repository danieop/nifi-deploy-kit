name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n export.sh deploy.sh
      - name: Validate exported bundles
        run: |
          shopt -s nullglob
          bundles=(bundles/*/config.json)
          for manifest in "${bundles[@]}"; do
            python3 -m nifi_deploy validate "$(dirname "$manifest")"
          done
      - name: Validate Compose models
        run: |
          python3 - <<'PYTHON'
          import json, subprocess, tempfile
          from pathlib import Path
          from nifi_deploy.portable_deployment import literal_compose
          for path in Path('bundles').glob('*/config.json'):
              config = json.loads(path.read_text())
              with tempfile.TemporaryDirectory() as directory:
                  compose = Path(directory) / 'compose.json'
                  compose.write_text(json.dumps(literal_compose(config['docker']['compose'])))
                  subprocess.run(['docker', 'compose', '-p', 'validate-' + config['name'], '-f', str(compose), 'config', '--quiet'], check=True)
          PYTHON
