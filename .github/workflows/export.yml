name: Export NiFi
run-name: Export ${{ inputs.bundle_name }}
on:
  workflow_dispatch:
    inputs:
      bundle_name:
        description: 'Bundle name, e.g. customer-a-prod (lowercase letters/digits/hyphens)'
        required: true
        type: string
      nifi_url:
        description: 'Source NiFi URL, e.g. http://nifi.customer.lan:9080/nifi'
        required: true
        type: string
      docker_host:
        description: 'Source SSH user@hostname or user@IPv4'
        required: true
        type: string
      compose_file:
        description: 'Absolute source Compose file, e.g. /opt/nifi/compose.yml'
        required: true
        type: string
      credentials_secret:
        description: 'Repository Secret name holding JSON credentials and verified knownHosts'
        required: true
        default: NIFI_EXPORT_CREDENTIALS
        type: string
      compose_project:
        description: 'Source Compose project (blank = resolved Compose name)'
        type: string
      ssh_port:
        description: 'Source SSH port'
        type: number
        default: 22
      docker_sudo:
        description: 'Use sudo for read-only Docker inspection on source'
        type: boolean
        default: false
      nifi_service:
        description: 'NiFi service name in source Compose'
        type: string
        default: nifi
      gateway_service:
        description: 'HTTP Basic Auth Nginx service name in source Compose'
        type: string
        default: nginx
      group_id:
        description: 'Optional source process-group ID (blank = root)'
        type: string
      runner_label:
        description: 'Trusted Linux/x64 self-hosted runner label with access to this source'
        required: true
        type: string
        default: nifi-network
      publish:
        description: 'Also push this bundle to an export branch for maintainer review'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: nifi-export
  cancel-in-progress: false
jobs:
  export:
    # Only trusted default-branch code runs with source credentials/network access.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, '${{ inputs.runner_label }}']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export selected NiFi and Docker source (read-only)
        id: export
        env:
          EXPORT_BUNDLE_NAME: ${{ inputs.bundle_name }}
          EXPORT_NIFI_URL: ${{ inputs.nifi_url }}
          EXPORT_DOCKER_HOST: ${{ inputs.docker_host }}
          EXPORT_COMPOSE_FILE: ${{ inputs.compose_file }}
          EXPORT_COMPOSE_PROJECT: ${{ inputs.compose_project }}
          EXPORT_SSH_PORT: ${{ inputs.ssh_port }}
          EXPORT_DOCKER_SUDO: ${{ inputs.docker_sudo }}
          EXPORT_NIFI_SERVICE: ${{ inputs.nifi_service }}
          EXPORT_GATEWAY_SERVICE: ${{ inputs.gateway_service }}
          EXPORT_GROUP_ID: ${{ inputs.group_id }}
          EXPORT_CREDENTIALS_JSON: ${{ secrets[inputs.credentials_secret] }}
        run: python3 scripts/ci-export.py
      - name: Validate selected bundle
        env:
          BUNDLE_PATH: ${{ steps.export.outputs.bundle_path }}
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m nifi_deploy validate "$BUNDLE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: nifi-export-${{ github.run_id }}
          # Contents of this ONE bundle are at the artifact root.
          path: ${{ steps.export.outputs.bundle_path }}/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish selected bundle branch
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_NAME: ${{ steps.export.outputs.bundle_name }}
          BUNDLE_PATH: ${{ steps.export.outputs.bundle_path }}
        run: |
          set -euo pipefail
          # Export checksums require every packaged asset, including names ignored
          # by repository-wide dev patterns. Stage only this generated bundle.
          git add --force -- "$BUNDLE_PATH"
          if git diff --cached --quiet -- "$BUNDLE_PATH"; then
            echo "No exported configuration changes"
            exit 0
          fi
          branch="Feat/refresh-nifi-export-${BUNDLE_NAME}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Feat: refresh NiFi export ${BUNDLE_NAME}"
          git push origin "$branch"
          echo "Open a PR: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}"
